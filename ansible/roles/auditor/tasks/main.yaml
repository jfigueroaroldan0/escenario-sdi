- name: Instalar John the Ripper, Hydra y AIDE
  apt:
    name: "{{ paquetes_auditor }}"
    state: present

# Exclusiones de AIDE para evitar falsos positivos en /etc
- name: Directorio de drop-ins de AIDE
  ansible.builtin.file:
    path: /etc/aide/aide.conf.d
    state: directory
    mode: '0755'

- name: Exclusiones de ficheros volátiles en /etc para AIDE
  ansible.builtin.copy:
    dest: /etc/aide/aide.conf.d/00_exclusiones
    mode: '0644'
    content: |
      # Gestionado por Ansible: exclusión de ficheros dinámicos y volátiles en /etc
      !/etc/ld\.so\.cache$
      !/etc/alternatives/.*
      !/etc/adjtime$

# Alertas por correo: avisa de modificaciones o borrados en /etc al mismo correo
# que el SDI (solo si hay smtp_password). Se configura antes de inicializar la
# base de datos para que la foto de referencia incluya la configuración final.
- name: Configurar las alertas por correo de /etc (AIDE)
  ansible.builtin.include_tasks: correo.yaml
  when: correo_habilitado | bool

- name: Aviso si el correo está desactivado (falta smtp_password)
  ansible.builtin.debug:
    msg: >
      Alertas por correo del auditor desactivadas: define smtp_password en group_vars/all.
  when: not (correo_habilitado | bool)

# Inicializar la base de datos de referencia tras toda la configuración
- name: Inicializar la base de datos de referencia de AIDE
  ansible.builtin.shell: >
    aide --config /etc/aide/aide.conf --init &&
    cp -f /var/lib/aide/aide.db.new /var/lib/aide/aide.db
  args:
    creates: /var/lib/aide/aide.db

# Si correo_habilitado está activo usamos aide-alerta-etc.timer y paramos dailyaidecheck
- name: Desactivar la comprobación diaria por defecto si está activo el timer de /etc
  ansible.builtin.systemd:
    name: dailyaidecheck.timer
    state: stopped
    enabled: no
  when: correo_habilitado | bool

- name: Activar la comprobación diaria de AIDE de Debian si no hay alertas de /etc
  ansible.builtin.systemd:
    name: dailyaidecheck.timer
    state: started
    enabled: yes
  when: not (correo_habilitado | bool)
