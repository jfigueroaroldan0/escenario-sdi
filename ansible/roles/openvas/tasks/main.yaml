# OpenVAS se despliega con los contenedores oficiales de Greenbone
# (Greenbone Community Containers), que necesitan Docker y docker compose
- name: Instalar los requisitos del repositorio de Docker
  apt:
    name:
      - ca-certificates
      - gnupg
    state: present

- name: Crear el directorio de claves de apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Descargar la clave del repositorio de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Añadir el repositorio de Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Instalar Docker y docker compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Arrancar Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Crear el directorio de Greenbone
  ansible.builtin.file:
    path: "{{ openvas_dir }}"
    state: directory
    mode: '0755'

# Asegurar que no quede ningún override de correo residual en OpenVAS (las alertas van en las VMs)
- name: Limpiar posibles ficheros de override de correo en OpenVAS
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ openvas_dir }}/compose.override.yaml"
    - "{{ openvas_dir }}/msmtprc"
    - "{{ openvas_dir }}/crear-alertas-openvas.sh"

# Es el compose.yaml oficial; solo cambian los puertos de nginx (443 y 9392),
# que escuchan en todas las interfaces y no solo en 127.0.0.1
- name: Copiar compose.yaml de Greenbone Community Edition
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ openvas_dir }}/compose.yaml"
    mode: '0644'
  register: compose

- name: Descargar las imágenes de Greenbone (tarda bastante la primera vez)
  ansible.builtin.command: >
    docker compose -f {{ openvas_dir }}/compose.yaml -p {{ openvas_proyecto }} pull
  when: compose.changed

- name: Levantar los contenedores de Greenbone
  ansible.builtin.command: >
    docker compose -f {{ openvas_dir }}/compose.yaml -p {{ openvas_proyecto }} up -d
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

# gvmd crea el usuario admin al arrancar: se reintenta hasta que esté listo.
# No se puede saber si la contraseña ya era esa, por eso no cuenta como cambio.
- name: Poner la contraseña del usuario admin de OpenVAS
  ansible.builtin.command: >
    docker compose -f {{ openvas_dir }}/compose.yaml -p {{ openvas_proyecto }}
    exec -T -u gvmd gvmd gvmd --user=admin --new-password={{ openvas_admin_password }}
  register: admin_pass
  until: admin_pass.rc == 0
  retries: 30
  delay: 20
  changed_when: false
  no_log: true

- name: Esperar a que responda la interfaz web de OpenVAS
  ansible.builtin.uri:
    url: https://localhost
    validate_certs: false
  register: gsa
  until: gsa.status == 200
  retries: 30
  delay: 10
